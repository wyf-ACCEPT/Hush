# Hush key overrides on top of mpv's default bindings.

# Speed: fine steps on [ ], coarse steps on { }, Backspace resets.
[ add speed -0.05
] add speed 0.05
{ add speed -0.25
} add speed 0.25
BS set speed 1.0

# Scroll: vertical = volume, horizontal = seek.
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2
WHEEL_LEFT  seek -5
WHEEL_RIGHT seek 5

# Click (pause), double click (full screen) and the plain arrow keys (seek step from the
# control bar, volume +/-10%) are handled natively in VideoView / PlayerWindowController.
# Right-click still toggles pause (mpv default).
